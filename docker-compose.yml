# Three services: Neo4j (with GDS), the FastAPI app, and Nginx as the only public entry point.
# Start with `make docker-run`, then load the data from the host with `make seed` and `make gds`.
# Values like ${NEO4J_ADMIN_PASSWORD} come from .env (git-ignored; copy .env.example).

services:
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_ADMIN_PASSWORD:?set NEO4J_ADMIN_PASSWORD in .env}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    ports:
      - "7474:7474"  # Neo4j Browser, for development
      - "7687:7687"  # Bolt: used by make seed / make gds from the host
    volumes:
      - neo4j_data:/data  # the graph survives `make docker-down`
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

  api:
    build: .
    image: ${API_IMAGE:-wine-graph-api}
    env_file: .env  # Neo4j credentials, API_KEY, LLM_API_URL / LLM_API_KEY / LLM_MODEL
    environment:
      NEO4J_URI: bolt://neo4j:7687  # inside the compose network, not localhost
      MODEL_PATH: /srv/models/tier_classifier.joblib
    volumes:
      - ./models:/srv/models:ro  # classifier written by `make gds`; retraining needs no rebuild
    depends_on:
      neo4j:
        condition: service_healthy
    expose:
      - "8000"  # reachable by nginx only, not published on the host

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  neo4j_data:
