name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: make install
      - run: make test  # unit + API tests with a fake database; fails under 60% coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
