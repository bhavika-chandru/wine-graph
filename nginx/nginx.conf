# Reverse proxy in front of the FastAPI service (third compose service).
# Single public entry point on port 80; the API and Neo4j are not exposed directly.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # 10 requests/second per client IP on the LLM endpoint (each call costs money/compute)
    limit_req_zone $binary_remote_addr zone=ask_limit:10m rate=10r/s;

    upstream api_upstream {
        server api:8000;   # compose service name
        keepalive 16;
    }

    log_format main '$remote_addr "$request" $status $body_bytes_sent ${request_time}s';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    server {
        listen 80;
        server_name _;

        client_max_body_size 16k;     # API bodies are tiny; reject large payloads early
        proxy_read_timeout 30s;       # above the Neo4j query timeout (10s)

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /api/ask {
            limit_req zone=ask_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://api_upstream;
        }

        location / {
            proxy_pass http://api_upstream;
        }

        # Nginx's own liveness, used by its compose healthcheck
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }
    }
}
