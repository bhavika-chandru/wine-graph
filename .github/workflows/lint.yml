name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # same as the Dockerfile
          cache: pip
      - run: make install
      - run: make lint  # course .pylintrc, fails under 9.5
